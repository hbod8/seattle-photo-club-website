<a href="{{ .Site.Home.RelPermalink }}">
  {{ with resources.Get "logo.png" }}
  <img src="{{ .RelPermalink }}" alt="logo">
  {{ else }}
    {{ errorf "Failed to get toney logo \"logo.png\""}}
  {{ end }}
</a>
{{ range site.Menus.main }}
{{ with .Page }}
<a {{ with .Params.class -}} class="{{ . }}" {{ end -}} href="{{ .RelPermalink }}">
  {{ .Title }}
</a>
{{ else }}
<a {{ with .Params.class -}} class="{{ . }}" {{ end -}} href="{{ .URL }}">
  {{ .Name }}
</a>
{{ end }}
{{ end }}
