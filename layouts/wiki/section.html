{{ define "main" }}
<main>
  <h1>{{ .Title }}</h1>
  {{ .Content }}
  {{ template "wikiTree" . }}
</main>
{{ end }}

{{ define "wikiTree" }}
<ul>
  {{ range .Sections.ByTitle }}
  <li>
    <a href="{{ .RelPermalink }}">{{ .Title }}</a>
    {{ template "wikiTree" . }}
  </li>
  {{ end }}
  {{ range .RegularPages.ByTitle }}
  <li><a href="{{ .RelPermalink }}">{{ .Title }}</a></li>
  {{ end }}
</ul>
{{ end }}
