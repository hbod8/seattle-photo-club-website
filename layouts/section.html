{{ define "main" }}
{{ partial "menu.html" . }}
<main>
  <h2>{{ .Title }}</h2>
  <ul>
    {{ range sort .Pages "PublishDate" "desc" }}
    <li>
      <h3><a href="{{ .Params.link }}">{{ .Title }}</a> — {{ .Params.author }} — {{ time.Format "January 2, 2006" .PublishDate }}</h3>
      <p>{{ .Content }}</p>
    </li>
    {{ end }}
  </ul>
</main>
{{ end }}
