locale: 'en-us'
title: 'Seattle Photo Club'
deployment:
  targets:
  - name: default
    url: s3://www.seattlephoto.club?region=us-west-2
# the following adds the discord link to the menu
menu:
  main:
    - name: Discord
      url: https://discord.gg/VDn6eDccS9
# taxonomies for browsing/filtering labs by their capability data
taxonomies:
  process: processes
  format: formats
  neighborhood: neighborhoods
# custom overrides for lab taxonomies
permalinks:
  taxonomy:
    processes: /labs/:slug/
    formats: /labs/:slug/
    neighborhoods: /labs/:slug/
  term:
    processes: /labs/:section/:slug/
    formats: /labs/:section/:slug/
    neighborhoods: /labs/:section/:slug/